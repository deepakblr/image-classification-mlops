services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    # Override with registry image in CD: API_IMAGE=ghcr.io/<owner>/cats-dogs-api:<tag>
    image: ${API_IMAGE:-cats-dogs-api:latest}
    ports:
      - "8000:8000"
    environment:
      MODEL_PATH: /app/models/champion_cnn.pt
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.48.0
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - api

  grafana:
    image: grafana/grafana:10.2.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ../monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ../monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ../monitoring/grafana/dashboard.json:/var/lib/grafana/dashboards/cats-dogs.json:ro
    depends_on:
      - prometheus
